<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Student President Vote</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="validate.js"></script>

</head>

<body>

<div class="container mt-3">
<h2>Student President Vote</h2>

<form action="#" method="post" onsubmit="return validateForm()">

<div class="mb-3">
<label for="sid" class="form-label">Student ID<span style="color:red">*</span></label>
<input type="text" class="form-control" id="sid" name="sid" required>
</div>

<div class="mb-3">
<label for="fname" class="form-label">First Name<span style="color:red">*</span></label>
<input type="text" class="form-control" id="fname" name="fname" required>
</div>

<div class="mb-3">
<label for="lname" class="form-label">Last Name<span style="color:red">*</span></label>
<input type="text" class="form-control" id="lname" name="lname" required>
</div>

<div class="mb-3">
<label class="form-label">Gender<span style="color:red">*</span></label><br>

<input type="radio" id="male" name="optradio" value="1" checked>
<label for="male">Male</label>

<input type="radio" id="female" name="optradio" value="2">
<label for="female">Female</label>

</div>

<div class="mb-3">
<label for="school" class="form-label">School/Faculty<span style="color:red">*</span></label>
<select class="form-select" id="school" name="school" required>
<option value="">-- Select School --</option>
<option value="1">School of Science and Technology</option>
<option value="2">School of Business</option>
<option value="3">School of Humanities</option>
<option value="4">International School of Management</option>
<option value="5">School of Engineering</option>
<option value="6">School of Communication Arts</option>
</select>
</div>

<div class="mb-3">
<label for="candi" class="form-label">Candidate No.<span style="color:red">*</span></label>
<input type="text" class="form-control" id="candi" name="candi" required>
</div>

<button type="submit" class="btn btn-primary">Submit</button>
<button type="reset" class="btn btn-secondary">Reset</button>

</form>
</div>

</body>
</html>
